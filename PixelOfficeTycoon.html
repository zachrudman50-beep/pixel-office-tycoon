<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Office Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: beige 90s office-computer panels on a night-shift navy desk. The pixel office is the hero on the left with its toolbar and needs meters; the shop panel sits beside it with category folders. Stacks on phones. Single committed look. */
:root{
  --night:#1c2032; --night-2:#272c44; --night-3:#323855;
  --case:#e4dac0; --case-hi:#fbf4e2; --case-dk:#b3a684;
  --ink:#2a2830; --ink-soft:#5d5849;
  --lcd:#a9b78f; --lcd-ink:#1e2a16; --lcd-dim:#84936b;
  --cash:#2f8f55; --cash-hi:#4fbf78; --cash-dk:#1f6038;
  --gold:#efb341; --gold-dk:#a8761c;
  --rebirth:#7d5bd0; --rebirth-hi:#a387ea; --rebirth-dk:#53398f;
  --ipo:#2f6fb5; --ipo-hi:#5f9be0; --ipo-dk:#1d4a7f;
  --merge:#c0407a; --merge-hi:#e06aa0; --merge-dk:#86244f;
  --danger:#b8443a;
  --n-e:#e0873a; --n-c:#5fae8a; --n-f:#d0508a; --n-o:#4f8fe0; --n-s:#efb341;
  --f-display:'Silkscreen','Courier New',monospace;
  --f-body:'Pixelify Sans','Trebuchet MS',sans-serif;
  --f-lcd:'VT323','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--night);color:var(--case)}
body{font-family:var(--f-body);font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;
  background-image:radial-gradient(var(--night-2) 1px,transparent 1px);background-size:8px 8px}
.app{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hud{display:flex;flex-wrap:wrap;align-items:stretch;gap:14px 22px}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;color:var(--gold);letter-spacing:.03em;text-shadow:3px 3px 0 #000;align-self:center}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--case-dk);letter-spacing:.14em;margin-top:8px;text-shadow:none}
.lcd{flex:1 1 520px;min-width:0;display:flex;flex-wrap:wrap;background:var(--lcd);color:var(--lcd-ink);margin:9px;
  box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--case-dk),0 0 0 9px var(--ink),inset 0 3px 0 rgba(0,0,0,.14)}
.lcd>div{flex:1 1 110px;min-width:0;padding:7px 12px 6px;border-right:2px dashed var(--lcd-dim)}
.lcd>div:last-child{border-right:0}
.lcd label{display:block;font-family:var(--f-display);font-size:10px;letter-spacing:.14em;color:#3d4a30}
.lcd b{display:block;font-family:var(--f-lcd);font-weight:400;font-size:30px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.career{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.career-top{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-display);font-size:12px;letter-spacing:.08em}
.career-top span:last-child{color:var(--case-dk);font-family:var(--f-lcd);font-size:18px;letter-spacing:0}
.xpbar{height:16px;background:var(--night-2);box-shadow:0 0 0 3px var(--ink);position:relative;overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--rebirth);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.25) 6px 8px)}
.career-sub{font-size:13px;color:var(--case-dk)}
.main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}}
.scene{display:flex;flex-direction:column;gap:12px;min-width:0}
.scene-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.scene-head h1{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.04em;text-wrap:balance}
.stars{color:var(--gold);font-family:var(--f-display);font-size:13px;letter-spacing:.1em;margin-left:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;padding:4px 8px;background:var(--night-2);box-shadow:0 0 0 2px var(--ink);white-space:nowrap}
.chip.full{background:var(--danger);color:#fff}
.chip.boost{background:var(--gold);color:var(--ink)}
.canvas-wrap{position:relative;max-width:100%;box-shadow:0 0 0 3px var(--ink),0 0 0 7px var(--case-dk),0 0 0 10px var(--ink);background:#000;cursor:pointer;user-select:none;-webkit-user-select:none;margin:10px;overflow:hidden}
.canvas-wrap.decor{cursor:crosshair;box-shadow:0 0 0 3px var(--ink),0 0 0 7px var(--gold),0 0 0 10px var(--ink)}
.canvas-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#cv{display:block;width:100%;height:auto;aspect-ratio:384/224;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floater{position:absolute;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--gold);white-space:nowrap;
  text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000;transform:translate(-50%,-100%);animation:rise .9s steps(10) forwards}
.floater.big{font-size:20px;color:var(--cash-hi)}
@keyframes rise{to{transform:translate(-50%,-320%);opacity:0}}
#decorHint{position:absolute;left:8px;top:8px;font-family:var(--f-display);font-size:11px;background:rgba(28,32,50,.85);color:var(--gold);padding:6px 8px;pointer-events:none;max-width:70%}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 14px;flex:1 1 300px;min-width:0}
.need{display:flex;flex-direction:column;gap:3px;font-family:var(--f-display);font-size:9px;letter-spacing:.08em}
.need .nb{height:8px;background:var(--night-2);box-shadow:0 0 0 2px var(--ink);position:relative;overflow:hidden}
.need .nb i{position:absolute;inset:0 auto 0 0;width:0}
.need .nv{font-family:var(--f-lcd);font-size:15px;letter-spacing:0;color:var(--case-dk)}
.goal{font-size:15px}
.goal b{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;color:var(--gold);display:block;margin-bottom:2px}
.mults{display:flex;flex-wrap:wrap;gap:8px}
.mults .chip{font-family:var(--f-lcd);font-size:17px;letter-spacing:0}
.btn{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink);background:var(--case);border:0;padding:10px 14px;cursor:pointer;
  box-shadow:inset -3px -3px 0 var(--case-dk),inset 3px 3px 0 var(--case-hi),0 0 0 3px var(--ink)}
.btn:active:not(:disabled){box-shadow:inset 3px 3px 0 var(--case-dk),inset -3px -3px 0 var(--case-hi),0 0 0 3px var(--ink);transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.cat:focus-visible,.link:focus-visible,.seg button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.btn.go{background:var(--cash);color:#fff;box-shadow:inset -3px -3px 0 var(--cash-dk),inset 3px 3px 0 var(--cash-hi),0 0 0 3px var(--ink)}
.btn.rb{background:var(--rebirth);color:#fff;box-shadow:inset -3px -3px 0 var(--rebirth-dk),inset 3px 3px 0 var(--rebirth-hi),0 0 0 3px var(--ink)}
.btn.ipo{background:var(--ipo);color:#fff;box-shadow:inset -3px -3px 0 var(--ipo-dk),inset 3px 3px 0 var(--ipo-hi),0 0 0 3px var(--ink)}
.btn.mg{background:var(--merge);color:#fff;box-shadow:inset -3px -3px 0 var(--merge-dk),inset 3px 3px 0 var(--merge-hi),0 0 0 3px var(--ink)}
.btn.gd{background:var(--gold);color:var(--ink);box-shadow:inset -3px -3px 0 var(--gold-dk),inset 3px 3px 0 #ffe3a0,0 0 0 3px var(--ink)}
.btn.work{font-size:16px;padding:14px 22px;min-width:180px}
.btn.work span,.buy span{display:block;font-family:var(--f-lcd);font-weight:400;font-size:19px;letter-spacing:0;margin-top:2px}
.btn.sm{font-size:11px;padding:7px 10px}
.btn.on{background:var(--gold)}
.panel{background:var(--case);color:var(--ink);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;margin:3px;
  box-shadow:0 0 0 3px var(--ink),inset -4px -4px 0 var(--case-dk),inset 4px 4px 0 var(--case-hi)}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:3px}
.cat{position:relative;font-family:var(--f-display);font-size:11px;font-weight:700;padding:9px 2px;border:0;cursor:pointer;background:var(--case-dk);color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.cat[aria-selected="true"]{background:var(--ink);color:var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:3px}
.tab{position:relative;font-family:var(--f-display);font-size:11px;font-weight:700;padding:7px 10px;border:0;cursor:pointer;color:var(--ink);background:var(--case-hi);box-shadow:0 0 0 2px var(--ink)}
.tab[aria-selected="true"]{background:var(--cash);color:#fff}
.dot{position:absolute;top:-5px;right:-5px;width:10px;height:10px;background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
#pane{display:flex;flex-direction:column;gap:12px;min-width:0}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--ink-soft);margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;padding:2px}
.seg button{font-family:var(--f-display);font-size:10px;font-weight:700;padding:5px 8px;border:0;cursor:pointer;background:var(--case-hi);color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.seg button[aria-pressed="true"]{background:var(--cash);color:#fff}
.list{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow-y:auto;padding:3px 8px 3px 3px}
@media (max-width:1000px){.list{max-height:none}}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--case-hi);padding:9px;box-shadow:0 0 0 2px var(--ink)}
.row.noico{grid-template-columns:minmax(0,1fr) auto}
.row.wide-ico{grid-template-columns:72px minmax(0,1fr) auto}
.row.locked{background:repeating-linear-gradient(135deg,var(--case) 0 8px,var(--case-hi) 8px 16px);color:var(--ink-soft)}
.row.here{box-shadow:0 0 0 2px var(--ink),0 0 0 5px var(--cash)}
.mid{min-width:0}
.ico{width:48px;height:44px;image-rendering:pixelated;background:var(--night-2);box-shadow:0 0 0 2px var(--ink);display:block}
.wide-ico .ico{width:72px;height:42px}
.nm{font-family:var(--f-display);font-size:13px;font-weight:700;line-height:1.2}
.nm .cnt{color:var(--cash);font-family:var(--f-lcd);font-size:20px;font-weight:400;margin-left:4px}
.ds{font-size:14px;color:var(--ink-soft)}
.st{font-size:13px;color:var(--ink-soft);margin-top:2px}
.st em{font-style:normal;color:var(--cash);font-weight:600}
.act{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.act.h{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}
.buy{min-width:104px;text-align:center;line-height:1.15;padding:8px 10px}
.link{font-family:var(--f-display);font-size:10px;background:none;border:0;padding:2px;color:var(--danger);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:disabled{opacity:.35;cursor:default;text-decoration:none}
.card{background:var(--case-hi);box-shadow:0 0 0 2px var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.dark{background:var(--ink);color:var(--case-hi)}
.card.gold{background:#fff1cc}
.card h3,.h3{margin:0;font-family:var(--f-display);font-size:13px;letter-spacing:.05em}
.pbar{height:14px;background:var(--night-2);box-shadow:0 0 0 2px var(--ink);position:relative;overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--cash);background-image:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,.2) 8px 10px)}
.pbar.gold i{background-color:var(--gold)} .pbar.rb i{background-color:var(--rebirth)} .pbar.ipo i{background-color:var(--ipo)} .pbar.mg i{background-color:var(--merge)}
.kv{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-lcd);font-size:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid3{grid-template-columns:minmax(0,1fr)}}
.compare>div{background:var(--case-hi);box-shadow:0 0 0 2px var(--ink);padding:10px}
.compare>div.after{background:var(--rebirth);color:#fff}
.compare b{display:block;font-family:var(--f-display);font-size:10px;letter-spacing:.12em;margin-bottom:4px}
.compare span{display:block;font-family:var(--f-lcd);font-size:21px;line-height:1.1}
.mini{font-size:13px}
.mini ul{margin:4px 0 0;padding-left:18px}
.lock-note{padding:18px;text-align:center;background:var(--case-hi);box-shadow:0 0 0 2px var(--ink);font-size:15px}
.lock-note b{display:block;font-family:var(--f-display);font-size:14px;margin-bottom:6px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{background:var(--case-hi);box-shadow:0 0 0 2px var(--ink);padding:8px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;font-size:12px;color:var(--ink)}
.item canvas{width:40px;height:40px;image-rendering:pixelated;background:var(--night-2);display:block}
.item .in{font-family:var(--f-display);font-size:10px;line-height:1.2;font-weight:700}
.item .rar{font-family:var(--f-display);font-size:9px;letter-spacing:.06em}
.item.unknown{opacity:.55}
.item .pbar{height:6px;margin-top:3px}
.reveal{display:flex;flex-wrap:wrap;gap:8px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{padding:8px;background:var(--case-hi);box-shadow:0 0 0 2px var(--ink);font-size:12px;min-width:0}
.ach b{display:block;font-family:var(--f-display);font-size:10px;line-height:1.25;margin-bottom:2px}
.ach.got{background:var(--cash);color:#fff}
.ach span{color:var(--ink-soft)} .ach.got span{color:#e4f6ea}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:14px}
.stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--case-dk);padding:3px 0}
.stats div b{font-family:var(--f-lcd);font-weight:400;font-size:18px}
.tog{display:flex;align-items:center;gap:10px;font-size:15px}
.tog input{width:20px;height:20px;accent-color:var(--cash)}
.tog input[type=number]{width:80px;height:auto;font-family:var(--f-lcd);font-size:18px;padding:2px 6px;border:0;box-shadow:0 0 0 2px var(--ink);background:#fff;color:var(--ink)}
select{font-family:var(--f-display);font-size:10px;padding:5px;border:0;box-shadow:0 0 0 2px var(--ink);background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%;min-height:90px;font-family:var(--f-lcd);font-size:15px;background:#fff;color:var(--ink);border:0;box-shadow:0 0 0 2px var(--ink);padding:8px;resize:vertical}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:3px}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.meters .need{font-size:10px}
.spark{width:96px;height:30px;image-rendering:pixelated;background:var(--night-2);box-shadow:0 0 0 2px var(--ink);display:block}
.up{color:var(--cash);font-weight:600} .down{color:var(--danger);font-weight:600}
.mail{background:var(--case-hi);box-shadow:0 0 0 2px var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.mail .btn{white-space:normal;text-align:left}
.mail.unread{box-shadow:0 0 0 2px var(--ink),inset 4px 0 0 var(--gold)}
.mail .from{font-family:var(--f-display);font-size:10px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px}
.mail h4{margin:0;font-family:var(--f-display);font-size:12px}
.mail p{margin:0;font-size:14px;max-width:62ch}
.mail .res{font-size:13px;color:var(--cash);font-weight:600}
.talent{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;background:var(--case-hi);box-shadow:0 0 0 2px var(--ink);padding:9px;align-items:start}
.talent .tf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.trait{font-family:var(--f-display);font-size:9px;padding:3px 5px;background:var(--ink);color:var(--case-hi)}
.mgc{width:100%;max-width:420px;aspect-ratio:2/1;image-rendering:pixelated;background:#000;box-shadow:0 0 0 2px var(--ink);display:block;cursor:pointer}
.izgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:420px}
.izgrid button{height:46px;font-family:var(--f-display);font-size:10px;border:0;box-shadow:0 0 0 2px var(--ink);background:var(--night-2);color:var(--case-dk);cursor:pointer}
.izgrid button.mail{background:var(--gold);color:var(--ink)}
.izgrid button.spam{background:var(--danger);color:#fff}
.rival{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--case-hi);box-shadow:0 0 0 2px var(--ink);padding:8px 10px}
.rival .rk{font-family:var(--f-lcd);font-size:24px}
.rival.you{background:var(--gold)}
.rival.beat{background:#dff0e4}
.rival b{font-family:var(--f-display);font-size:11px}
@media (max-width:480px){
  .row,.row.wide-ico{grid-template-columns:40px minmax(0,1fr)}
  .row .act{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center}
  .row.noico{grid-template-columns:minmax(0,1fr)}
  .row .ico{width:40px;height:37px} .wide-ico .ico{width:40px;height:24px}
  .lcd b{font-size:24px}
  .btn.work{flex:1 1 100%}
  .grid2,.meters{grid-template-columns:minmax(0,1fr)}
  .cats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stats{grid-template-columns:minmax(0,1fr)}
}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--case-dk)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;z-index:20;pointer-events:none;width:min(92vw,480px)}
.toast{font-family:var(--f-display);font-size:12px;letter-spacing:.03em;background:var(--ink);color:var(--case-hi);padding:10px 14px;box-shadow:0 0 0 3px var(--case-dk);text-align:center;transition:opacity .3s,transform .3s}
.toast.gold{color:var(--gold)}
.toast.lvl{background:var(--rebirth);color:#fff;box-shadow:0 0 0 3px var(--ink)}
.toast.ach{background:var(--cash);color:#fff;box-shadow:0 0 0 3px var(--ink)}
.toast.mail{background:var(--ipo);color:#fff;box-shadow:0 0 0 3px var(--ink)}
.toast.out{opacity:0;transform:translateY(8px)}
@media (prefers-reduced-motion:reduce){.floater{animation:fade .9s forwards}@keyframes fade{to{opacity:0}}.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand">PIXEL OFFICE<br>TYCOON<small>EST. IN MOM'S GARAGE · V3</small></div>
    <div class="lcd">
      <div><label>CASH</label><b id="hudCash">$0</b></div>
      <div><label>PER SEC</label><b id="hudRate">$0</b></div>
      <div><label>SHARES</label><b id="hudShares">0</b></div>
      <div><label>GOLD BARS</label><b id="hudGold">0</b></div>
    </div>
    <div class="career">
      <div class="career-top"><span id="lvlText">CAREER LVL 1</span><span id="xpText">0 / 50 XP</span></div>
      <div class="xpbar"><i id="xpFill"></i></div>
      <div class="career-sub">+5% income and 1 skill point per level. Levels are never reset.</div>
    </div>
  </header>
  <main class="main">

  if (n == null || isNaN(n)) return '0';

  const ex = Math.floor(Math.log10(n));

  if (!d || typeof d !== 'object') return s;
  for (const k of Object.keys(d)){
    if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && d[k] && typeof d[k] === 'object' && !Array.isArray(d[k])) s[k] = Object.assign(s[k], d[k]);

  }

function computeTalent(){
  const T = {dept:{}, inc:0, xp:0, freq:0, cost:0, night:0, morning:0, click:0, luck:0, trade:0, style:0, clean:0, c:0, e:0, f:0, o:0, rspeed:0, contract:0, shares:0, offline:0, gold:0, heads:0};

function computeDecor(){
  const L = layout(S.office), all = [];
  for (const p of L.f){ const d = FURN_BY[p.id]; if (d) all.push({p, d, b:boxOf(p, d)}); }
  for (const p of L.w){ const d = FURN_BY[p.id]; if (d) all.push({p, d, b:boxOf(p, d)}); }
  const sets = {};
  all.forEach(x => { if (x.d.set) sets[x.d.set] = (sets[x.d.set] || 0) + 1; });
  const setMult = s => { const n = sets[s] || 0; return n >= 20 ? 1.5 : n >= 10 ? 1.25 : n >= 5 ? 1.1 : 1; };
  const rugs = all.filter(x => x.d.layer === 'r');
  const syn = {breakroom:0, game:0, window:0, lamp:0, zen:0, gallery:0, rug:0};
  const sup = {e:0, c:0, f:0, o:0};
  let style = 0, clean = 0, jan = 0, lamps = 0, ev = 0;
  const gmul = researchVal('decor') * (1 + 0.04 * sk('interior')) * (1 + 0.05 * sh('stylist')) * Math.pow(1.5, ms('cosmicdecor')) * (M.decorUp || 1);
  for (const x of all){
    const d = x.d, stt = d.stats;
    let m = (1 + 0.25 * (fLevel(d.id) - 1)) * setMult(d.set) * gmul, om = 1, cm = 1;
    if (d.cat === 'energy' && all.some(y => y.d.cat === 'seat' && gap(x.b, y.b) <= 3)){ m *= 1.5; syn.breakroom++; }
    if (d.cat === 'fun' && all.some(y => y !== x && y.d.cat === 'fun' && y.d.id !== d.id && gap(x.b, y.b) <= 2)){ m *= 1.25; syn.game++; }
    if (d.cat === 'plant' && d.layer === 'f' && x.p.y === 0){ cm = 1.5; syn.window++; }
    if (d.cat === 'desk' && all.some(y => y.d.cat === 'light' && gap(x.b, y.b) <= 2)){ om = 1.3; syn.lamp++; }
    if (d.cat === 'focus' && !all.some(y => y.d.cat === 'fun' && gap(x.b, y.b) <= 3)){ m *= 1.25; syn.zen++; }
    if (d.cat === 'art' && all.some(y => y !== x && y.d.cat === 'art' && gap(x.b, y.b) <= 1)){ m *= 1.25; syn.gallery++; }
    if (d.layer === 'f' && rugs.some(r => overlaps(x.b, r.b))){ m *= 1.2; syn.rug++; }
    sup.e += (stt.e || 0) * m; sup.c += (stt.c || 0) * m * cm; sup.f += (stt.f || 0) * m; sup.o += (stt.o || 0) * m * om;
    style += (stt.s || 0) * m; clean += stt.cl || 0; jan += stt.jan || 0; ev += stt.ev || 0;
    if (d.cat === 'light') lamps++;
  }
  const synTotal = Object.values(syn).reduce((a, b) => a + b, 0);
  DEC = {sup, style, clean, jan, lamps, ev, sets, syn, synTotal, count:all.length, desks:L.f.filter(p => FURN_BY[p.id] && FURN_BY[p.id].cat === 'desk').length};
  decorDirty = false;
}
const WEATHER = {
  sunny:{n:'SUNNY', mod:{c:1.1}}, cloudy:{n:'CLOUDY', mod:{}}, rain:{n:'RAIN', mod:{o:1.1, f:0.95}}, storm:{n:'STORM', mod:{o:1.15, e:0.9}},
  snow:{n:'SNOW', mod:{c:0.9, f:1.1}}, fog:{n:'FOG', mod:{o:0.95, c:1.05}}, clear:{n:'CLEAR', mod:{}}, meteors:{n:'METEORS', mod:{f:1.1}},
};

function recalc(){
  if (talentDirty || !TAL) computeTalent();
  const m = {click:1, all:1, xp:1, seatsPct:0, cost:1, hustle:0, case:1, role:{}, decorUp:1};
  for (const id in S.up){
    const u = UP_BY[id]; if (!u) continue;
    if (u.kind === 'role') m.role[u.role] = (m.role[u.role] || 1) * u.val;
    else if (u.kind === 'click') m.click *= u.val;
    else if (u.kind === 'all') m.all *= u.val;
    else if (u.kind === 'xp') m.xp *= u.val;
    else if (u.kind === 'hustle') m.hustle += u.val;
    else if (u.kind === 'case') m.case *= u.val;
    else if (u.kind === 'seats') m.seatsPct += u.val;
    else if (u.kind === 'cost') m.cost *= u.val;
    else if (u.kind === 'decor') m.decorUp *= u.val;
  }
  if (M.decorUp !== m.decorUp) decorDirty = true;
  M.decorUp = m.decorUp;
  if (decorDirty || !DEC) computeDecor();
  const R = {inc:1, click:1, xp:1, offline:0, offrate:0, seats:0, cost:1, auto:0, shares:1, gold:0, freq:0, low:1, rspeed:0, luck:0, trade:0, clean:0, night:0};
  for (const id in S.research.done){
    const p = RES_BY[id]; if (!p || p.type === 'decor' || p.type === 'talent') continue;
    if (['inc','click','xp','cost','shares','low'].includes(p.type)) R[p.type] *= p.val; else R[p.type] += p.val;
  }
  const I = {inc:0, click:0, xp:0, shares:0, gold:0, rspeed:0, luck:0, offline:0, case:0};
  for (const id in S.items){ const it = ITEM_BY[id], o = S.items[id]; if (it && o && o.lv) I[it.type] += it.per * o.lv; }
  const T = TAL, emp = totalEmp();
  m.emp = emp; m.R = R; m.T = T;
  // office needs
  const hr = gameHour(), night = isSpace() ? 0.5 : nightness(hr);
  const wmod = (WEATHER[S.weather.type] || WEATHER.sunny).mod;
  const demand = 4 * Math.sqrt(Math.max(1, emp));
  const sat = {}; let needF = 1;
  for (const [k] of NEEDS){
    let s = DEC.sup[k] * (wmod[k] || 1) * (1 + (T[k] || 0));
    if (k === 'o' && night > 0.3) s *= Math.min(1, 0.7 + 0.1 * DEC.lamps + R.night);
    sat[k] = s / demand;
    needF *= 0.85 + 0.35 * Math.min(1.5, sat[k]);
  }
  const style = DEC.style * (1 + T.style);
  const styleMult = 1 + Math.sqrt(style) / 10;
  const cleanF = 1 - 0.008 * Math.min(25, S.trash.length);
  m.dec = {demand, sat, needF, style, styleMult, cleanF, night, hr};
  m.decorMult = needF * styleMult * cleanF;
  m.rbase = 1.5 + 0.01 * sh('insider') + 0.05 * st('rbase');
  m.reb = Math.pow(m.rbase, S.rebirths);
  m.achMult = 1 + 0.02 * achN;
  m.rivalMult = 1 + 0.05 * Object.keys(S.rivals.beat).length;
  m.levelMult = 1 + 0.05 * (S.level - 1);
  m.officeMult = office().mult;
  m.shopMult = Math.pow(1.12, sh('investor')) * Math.pow(2, st('bluechip')) * Math.pow(10, ms('galactic'));
  const timeMult = 1 + T.night * night + (hr >= 5 && hr < 12 ? T.morning : 0);
  m.global = m.reb * m.officeMult * m.levelMult * m.achMult * m.rivalMult * m.all * R.inc * (1 + I.inc) * (1 + 0.03 * sk('boss')) * (1 + T.inc)
    * m.shopMult * (1 + 0.002 * sk('synergy') * emp / 100) * (1 + 0.02 * sk('bigshot') * S.office) * boostMult('income') * m.decorMult * timeMult;
  m.low = R.low;
  m.xpMult = m.reb * m.xp * R.xp * (1 + I.xp) * (1 + 0.04 * sk('reader')) * (1 + 0.1 * sh('learn')) * Math.pow(1.5, st('xpboost')) * Math.pow(3, ms('cosmicxp')) * (1 + T.xp);
  m.clickMult = m.click * R.click * (1 + I.click) * (1 + 0.1 * sk('hustler')) * (1 + 0.5 * sh('work')) * boostMult('click') * (1 + T.click);
  m.costMult = m.cost * R.cost * (1 - 0.01 * sk('negot')) * Math.pow(0.98, sh('recruit')) * (1 - Math.min(0.5, T.cost));
  m.seats = Math.floor(office().seats * (1 + m.seatsPct + R.seats + 0.1 * sh('desk')));
  m.shareMult = R.shares * (1 + I.shares) * (1 + 0.03 * sk('dealer')) * (1 + 0.05 * sh('parachute')) * Math.pow(1.5, st('sharemult')) * (1 + T.shares);
  m.stockMult = Math.pow(2, ms('stockmult'));
  m.goldMult = (1 + R.gold) * (1 + I.gold) * (1 + 0.02 * sk('treasure')) * (1 + 0.1 * st('gold')) * (1 + 0.25 * ms('goldm')) * (1 + T.gold);
  m.rspeed = (1 + R.rspeed) * (1 + I.rspeed) * (1 + 0.02 * sk('mad')) * (1 + 0.1 * st('rspeed')) * (1 + T.rspeed);
  m.luck = R.luck + I.luck + 0.01 * sk('collector') + 0.05 * st('luck') + 0.1 * ms('cosmicluck') + T.luck;
  m.tluck = 0.02 * sk('scout') + 0.1 * ms('cosmicluck');
  m.offCap = 3600 * (2 + sh('weekend') + 2 * st('offline2') + 12 * ms('timedil') + 0.5 * sk('owl') + R.offline + T.offline) + I.offline * 60;
  m.offRate = Math.min(1, 0.5 + 0.05 * sh('overtime') + 0.1 * ms('timedil') + R.offrate);
  m.eventFreq = (1 + 0.05 * sh('radar')) * (1 + R.freq) * (1 + T.freq);
  m.eventVal = m.case * (1 + I.case) * (1 + 0.1 * sk('lucky')) * (1 + DEC.ev);
  m.auto = 0.2 * sk('multi') + R.auto;
  m.slots = 1 + st('lab') + ms('lab2');
  m.contractMult = (1 + 0.05 * sk('contract')) * (1 + T.contract);
  m.tradeMult = 1 + R.trade + 0.02 * sk('trader') + T.trade;
  m.fee = Math.max(0, 0.02 - 0.001 * sk('trader'));
  m.trashRate = Math.max(0.1, (1 - 0.03 * sk('neat') - R.clean - Math.min(0.5, T.clean)) * Math.pow(0.88, DEC.clean));
  m.roster = 12 + 3 * st('roster');
  M = m;
  let inc = 0;
  for (const s of STAFF){ const c = S.emp[s.id] || 0; if (c) inc += c * roleRate(s); }
  M.income = inc;
  M.clickVal = S.level * M.clickMult * M.global + M.hustle * inc;
}
function roleRate(s){
  const c = S.emp[s.id] || 0;
  return s.rate * (M.role[s.id] || 1) * Math.pow(2, Math.floor(Math.min(c, 1000) / 50)) * (s.tier < 7 ? M.low : 1) * (TAL.dept[s.id] || 1) * M.global;
}
function costFor(s, k){ const o = S.emp[s.id] || 0; return s.base * M.costMult * Math.pow(1.15, o) * (Math.pow(1.15, k) - 1) / 0.15; }
function maxAfford(s){
  const first = s.base * M.costMult * Math.pow(1.15, S.emp[s.id] || 0);
  if (!(S.cash >= first)) return 0;
  return Math.max(1, Math.floor(Math.log(S.cash * 0.15 / first + 1) / Math.log(1.15)));
}
function hireAmount(s){
  const free = M.seats - totalEmp();
  if (free <= 0) return 0;
  const k = S.amt === 'max' ? Math.max(1, maxAfford(s)) : S.amt;
  return Math.min(k, free);
}

function rollRarity(w, luck){ const L = 1 + luck * 0.5; const ww = w.map((x, k) => x * Math.pow(L, k)); let r = Math.random() * ww.reduce((a, b) => a + b, 0); for (let k = 0; k < ww.length; k++){ r -= ww[k]; if (r <= 0) return k; } return 0; }

function runAutomation(){

      if (M.seats - totalEmp() <= 0) break;
      let best = null, bv = 0;

      if (!best) break;

    }

  if (sh('automove') && S.auto.move){ for (let i = OFFICES.length - 1; i > S.office; i--){ if (unlocked(OFFICES[i].req) && S.cash >= OFFICES[i].cost){ moveOffice(i, true); break; } } }
  if (st('autosell') && S.auto.sell && S.run + marketValue() >= sellTarget() * Math.max(1, +S.auto.sellX || 1)) doSell(true);

let layoutDirty = true;
function layout(i){ if (i == null) i = S.office; return S.decor.layouts[i] || (S.decor.layouts[i] = autoLayout(i)); }
const placedCount = (id, L) => L.f.filter(p => p.id === id).length + L.w.filter(p => p.id === id).length;
const inSeason = d => d.month == null || d.month === month();
function canPlace(d, x, y, L, i, ignore){
  const A = areaOf(i);
  if (d.layer === 'w'){
    if (x < A.x0 || x + d.w > A.x0 + A.w) return false;
    for (let k = 0; k < d.w; k++) if (wallBlocked(i, x + k)) return false;
    return !L.w.some(p => p !== ignore && FURN_BY[p.id] && x < p.x + FURN_BY[p.id].w && p.x < x + d.w);
  }
  if (x < A.x0 || y < 0 || x + d.w > A.x0 + A.w || y + d.h > A.h) return false;
  const b = {x, y, w:d.w, h:d.h};
  for (const p of L.f){
    if (p === ignore) continue;
    const e = FURN_BY[p.id]; if (!e) continue;
    if ((e.layer === 'r') !== (d.layer === 'r')) continue;
    if (overlaps(b, {x:p.x, y:p.y, w:e.w, h:e.h})) return false;
  }
  return true;
}
function autoLayout(i, owned){
  owned = owned || S.decor.owned;
  const A = areaOf(i), L = {f:[], w:[]};
  const put = (id, x, y) => { const d = FURN_BY[id]; if (d && canPlace(d, x, y, L, i)){ (d.layer === 'w' ? L.w : L.f).push(d.layer === 'w' ? {id, x} : {id, x, y}); return true; } return false; };
  put('ceo', A.x0 + Math.floor(A.w / 2) - 1, A.h - 2);
  const expand = filter => { const out = []; FURN.filter(filter).sort((a, b) => b.cost - a.cost).forEach(d => { for (let k = 0; k < (owned[d.id] || 0); k++) out.push(d.id); }); return out; };
  const desks = expand(d => d.cat === 'desk');
  let k = 0;
  for (let y = 1; y + 2 <= A.h - 2 && k < desks.length; y += A.h <= 8 ? 2 : 3) for (let x = A.x0 + 1; x + 2 <= A.x0 + A.w - 1 && k < desks.length; x += 3) if (put(desks[k], x, y)) k++;
  const spots = [];
  for (let x = A.x0; x < A.x0 + A.w; x++) spots.push([x, 0]);
  for (let y = 1; y < A.h; y++){ spots.push([A.x0, y]); spots.push([A.x0 + A.w - 1, y]); }
  for (let y = 1; y < A.h; y++) for (let x = A.x0 + 1; x < A.x0 + A.w - 1; x++) spots.push([x, y]);
  for (const id of expand(d => d.layer === 'f' && d.cat !== 'desk' && d.cat !== 'ceo')) for (const [x, y] of spots) if (put(id, x, y)) break;
  for (const id of expand(d => d.layer === 'r')) for (const [x, y] of spots) if (put(id, x, y)) break;
  for (const id of expand(d => d.layer === 'w')) for (let x = A.x0; x < A.x0 + A.w; x++) if (put(id, x, 0)) break;
  return L;
}
function furnCost(d){ return d.cost * Math.pow(1.6, Math.max(0, fOwned(d.id) - (STARTER[d.id] || 0))); }
function furnLvCost(d){ return Math.max(100, d.cost) * 4 * Math.pow(5, fLevel(d.id) - 1); }

let lastMarket = 0;
function initMarket(){ for (const s of STOCKS){ if (!S.market.p[s.sym]) S.market.p[s.sym] = 100; if (!Array.isArray(S.market.hist[s.sym])) S.market.hist[s.sym] = [S.market.p[s.sym]]; } }
function gauss(){ return (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 1.2; }
function tickMarket(){
  let news = null;
  for (const s of STOCKS){
    let p = S.market.p[s.sym] || 100;
    p *= Math.exp(0.004 * Math.log(100 / p) + 0.0008 + s.vol * gauss());
    if (!news && Math.random() < 0.012){ const [dir, line] = pick(NEWS); p *= dir > 0 ? rand(1.12, 1.4) : rand(0.65, 0.88); news = line.replace('%s', s.name); }
    p = clamp(p, 4, 2500);
    S.market.p[s.sym] = p;
    const h = S.market.hist[s.sym]; h.push(p); if (h.length > 60) h.shift();
  }
  if (news){ S.market.news = news; }
}
function buyStock(sym){
  const amt = S.cash * (S.market.frac || 0.25); if (!(amt > 0)) return;
  const p = S.market.p[sym], h = S.market.hold[sym] || (S.market.hold[sym] = {u:0, cost:0});
  S.cash -= amt; h.u += amt / p; h.cost += amt; S.market.trades++; updateUI();
}
function sellStock(sym, silent){
  const h = S.market.hold[sym]; if (!h || !h.u) return 0;
  const gross = h.u * S.market.p[sym];
  let net = gross * (1 - M.fee); const prof = net - h.cost;
  if (prof > 0) net = h.cost + prof * M.tradeMult;
  const ratio = h.cost > 0 ? (net - h.cost) / h.cost : 0;
  S.market.bestTrade = Math.max(S.market.bestTrade, ratio);
  S.market.profit += net - h.cost; S.market.trades++;
  delete S.market.hold[sym];
  S.cash += net; if (net > h.cost) { S.run += net - h.cost; S.total += net - h.cost; }
  if (!silent) toast((net >= h.cost ? 'Sold for a profit of ' : 'Sold at a loss of ') + money(Math.abs(net - h.cost)), net >= h.cost ? 'gold' : '');
  updateUI();
  return net;
}

function checkAchievements(){
  let n = 0;
  if (M.dec){ S.stats.styleMax = Math.max(S.stats.styleMax, M.dec.style); if (NEEDS.every(([k]) => M.dec.sat[k] >= 1)) S.stats.perfect = true; }
  if (DEC) S.stats.synMax = Math.max(S.stats.synMax, DEC.synTotal);
  const h = new Date().getHours(); if (h < 4) S.stats.nightPlay = 1;
  for (const a of ACH){
    if (S.ach[a.id]) continue;
    let ok = false; try { ok = a.check(); } catch(e){}
    if (ok){ S.ach[a.id] = 1; n++; const g = addGold(a.gold, true); if (n <= 3) toast('ACHIEVEMENT: ' + a.name + ' (+' + g + ' gold)', 'ach'); }
  }
  if (n > 3) toast('+' + (n - 3) + ' more achievements', 'ach');
  if (n){ achN = Object.keys(S.ach).length; recalc(); dirty.awards = true; }
}

function drawChar(c, x, y, L, o){
  const skin = L.skin, hair = L.hair, shirt = L.shirt, pants = L.pants || '#2f3446', t = o.t || 0, dir = o.dir || 'down';

  if (o.pose !== 'sit'){
    alpha(c, 0.25, () => R(c, x + 2, y + 17, 8, 2, '#000'));
    const f = o.pose === 'walk' ? Math.floor(t * 8 + (o.idx || 0)) % 2 : 0;
    R(c, x + 3, y + 13, 2, 4 - f, pants); R(c, x + 7, y + 13, 2, 3 + f, pants);

  }

  if (L.tie && dir !== 'up') R(c, x + 5, y + 7, 2, 4, L.tie);
  const hand = L.robot ? '#8d959e' : skin;
  if (o.pose === 'sit'){
    const ph = Math.floor((RM ? 0 : t) * (o.fast ? 22 : 7) + (o.idx || 0) * 1.7) % 2;
    R(c, x + 1, y + 9, 2, 4, shirt); R(c, x + 9, y + 9, 2, 4, shirt);

    R(c, x + 1, y + 8 + sw, 1, 4, shirt); R(c, x + 10, y + 8 - sw, 1, 4, shirt);
    R(c, x + 1, y + 12 + sw, 1, 1, hand); R(c, x + 10, y + 12 - sw, 1, 1, hand);

  if (L.robot){
    R(c, x + 6, y - 3, 1, 3, '#7a828c'); R(c, x + 6, y - 4, 1, 1, '#ff5a4a');

      if (L.shades) R(c, x + 3, y + 3, 6, 2, '#0d0d12');
      else if (!blink){
        if (dir === 'left') R(c, x + 3, y + 3, 1, 2, '#2a2228');
        else if (dir === 'right') R(c, x + 8, y + 3, 1, 2, '#2a2228');
        else { R(c, x + 4, y + 3, 1, 2, '#2a2228'); R(c, x + 7, y + 3, 1, 2, '#2a2228'); }

      if (o.happy) R(c, x + 5, y + 5, 2, 1, '#8a4a3a');
    }
  }
  if (L.helmet){ R(c, x + 1, y - 2, 10, 3, '#efb341'); R(c, x + 5, y - 2, 2, 1, '#fff7c0'); }
  if (L.hat){ R(c, x, y - 1, 12, 1, L.hat); R(c, x + 2, y - 3, 8, 2, L.hat); R(c, x + 3, y - 5, 6, 2, L.hat); R(c, x + 4, y - 8, 4, 3, L.hat); R(c, x + 5, y - 4, 1, 1, '#efb341'); }

/* ================= WORKER SIMULATION ================= */
let workers = [], wanderers = [], blocked = null, blockedFor = -1;
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
function blockedGrid(){
  if (blocked && !layoutDirty && blockedFor === S.office) return blocked;
  const L = layout();
  blocked = Array.from({length:ROWS}, () => new Array(COLS).fill(false));
  for (const p of L.f){ const d = FURN_BY[p.id]; if (!d || d.layer === 'r') continue; for (let dy = 0; dy < d.h; dy++) for (let dx = 0; dx < d.w; dx++){ const yy = p.y + dy, xx = p.x + dx; if (yy >= 0 && yy < ROWS && xx >= 0 && xx < COLS) blocked[yy][xx] = true; } }
  layoutDirty = false; blockedFor = S.office;
  return blocked;
}
function bfs(starts, isGoal){
  const A = areaOf(S.office), B = blockedGrid(), key = (x, y) => y * COLS + x, prev = new Map(), q = [];
  for (const [x, y] of starts){ prev.set(key(x, y), -1); q.push([x, y]); }
  let head = 0;
  while (head < q.length){
    const [x, y] = q[head++];
    if (isGoal(x, y) && !starts.some(s => s[0] === x && s[1] === y)){
      const path = []; let k = key(x, y); while (k !== -1){ path.push([k % COLS, Math.floor(k / COLS)]); k = prev.get(k); } return path.reverse();
    }
    for (const [dx, dy] of DIRS){
      const nx = x + dx, ny = y + dy;
      if (nx < A.x0 || nx >= A.x0 + A.w || ny < 0 || ny >= A.h) continue;
      const k = key(nx, ny); if (prev.has(k)) continue;
      if (B[ny][nx] && !isGoal(nx, ny)) continue;
      prev.set(k, key(x, y)); q.push([nx, ny]);
    }
  }
  return null;
}
const tilePx = (tx, ty) => ({x:tx * TS + 2, y:FY + ty * TS - 4});
function goalSetFor(cats){
  const L = layout(), B = blockedGrid(), A = areaOf(S.office), set = new Set();
  for (const p of L.f){
    const d = FURN_BY[p.id]; if (!d || d.layer === 'r' || !cats.includes(d.cat)) continue;
    for (let dy = 0; dy < d.h; dy++) for (let dx = 0; dx < d.w; dx++) for (const [ox, oy] of DIRS){
      const nx = p.x + dx + ox, ny = p.y + dy + oy;
      if (nx >= A.x0 && nx < A.x0 + A.w && ny >= 0 && ny < A.h && !B[ny][nx]) set.add(ny * COLS + nx);
    }
  }
  return set;
}
function buildWorkers(){
  const L = layout();
  const desks = L.f.filter(p => FURN_BY[p.id] && FURN_BY[p.id].cat === 'desk').sort((a, b) => b.y - a.y || a.x - b.x);
  const n = Math.min(desks.length, totalEmp(), 40);
  const owned = STAFF.map(s => ({s, c:S.emp[s.id] || 0})).filter(o => o.c > 0).reverse();
  const total = owned.reduce((a, o) => a + o.c, 0), list = [];
  if (total <= n) owned.forEach(o => { for (let i = 0; i < o.c; i++) list.push(o.s); });
  else {
    const pk = owned.slice(0, n), rem = n - pk.length, tot = pk.reduce((a, o) => a + o.c, 0);
    const alloc = pk.map(o => ({o, k:1 + Math.floor(rem * o.c / tot), f:(rem * o.c / tot) % 1}));
    let left = n - alloc.reduce((a, x) => a + x.k, 0);
    [...alloc].sort((a, b) => b.f - a.f).forEach(x => { if (left > 0){ x.k++; left--; } });
    alloc.forEach(x => { for (let i = 0; i < x.k; i++) list.push(x.o.s); });
  }
  workers = desks.slice(0, n).map((p, i) => ({desk:p, s:list[i] || STAFF[0], look:staffLook(list[i] || STAFF[0], i + p.x * 3 + p.y), idx:i, state:'sit', timer:rand(5, 60), x:0, y:0, path:null, emote:null, emoteT:0, dir:'down'}));
  wanderers = S.talent.roster.filter(t => t.role).slice(0, 4).map((t, i) => { const f = freeTile() || [areaOf(S.office).x0, 0]; const p = tilePx(f[0], f[1]); return {tal:t, look:Object.assign({}, t.look), idx:50 + i, state:'idle', timer:rand(1, 5), x:p.x, y:p.y, tx:f[0], ty:f[1], path:null, dir:'down'}; });
  crewDirty = false;
}
const NEED_TRIP = [['e',['energy'],'coffee'],['f',['fun'],'game'],['c',['seat'],'zzz'],['s',['plant','art'],'heart']];
function stepPath(w, dt){
  const sp = 28 * dt;
  while (w.path && w.path.length){
    const [tx, ty] = w.path[0], p = tilePx(tx, ty), dx = p.x - w.x, dy = p.y - w.y, dist = Math.hypot(dx, dy);
    if (dist <= sp){ w.x = p.x; w.y = p.y; w.tx = tx; w.ty = ty; w.path.shift(); continue; }
    w.x += dx / dist * sp; w.y += dy / dist * sp;
    w.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    return false;
  }
  return true;
}
function updateWorkers(dt){
  if (crewDirty) buildWorkers();
  const sat = M.dec ? M.dec.sat : {e:1, c:1, f:1, o:1};
  for (const w of workers){
    if (w.emoteT > 0) w.emoteT -= dt;
    if (w.state === 'sit'){
      w.timer -= dt;
      if (w.timer <= 0){
        const trip = wpick(NEED_TRIP, n => n[0] === 's' ? 0.3 : Math.max(0.2, 1.5 - (sat[n[0]] || 0)));
        const goals = goalSetFor(trip[1]);
        const starts = [[w.desk.x, w.desk.y], [w.desk.x + 1, w.desk.y]];
        const path = goals.size ? bfs(starts, (x, y) => goals.has(y * COLS + x)) : null;
        if (path && path.length > 1){ const p = tilePx(path[0][0], path[0][1]); w.x = p.x; w.y = p.y; w.path = path.slice(1); w.state = 'walk'; w.trip = trip; }
        else {
          w.timer = rand(20, 50);
          const low = NEEDS.find(([k]) => sat[k] < 0.6);
          if (low && Math.random() < 0.6){ w.emote = '!' + low[0]; w.emoteT = 2.5; }
        }
      }
    } else if (w.state === 'walk' || w.state === 'back'){
      if (stepPath(w, dt)){
        if (w.state === 'back'){ w.state = 'sit'; w.timer = rand(25, 90); }
        else { w.state = 'use'; w.timer = rand(3, 6); w.emote = w.trip[2]; w.emoteT = w.timer; }
      }
    } else if (w.state === 'use'){
      w.timer -= dt;
      if (w.timer <= 0){
        const cx = w.desk.x, cy = w.desk.y;
        const path = bfs([[w.tx, w.ty]], (x, y) => y === cy && (x === cx || x === cx + 1));
        if (path && path.length > 1){ w.path = path.slice(1); w.state = 'back'; w.hold = w.trip[0] === 'e' ? 'coffee' : null; }
        else { w.state = 'sit'; w.timer = rand(25, 90); }
      }
    }
  }
  for (const w of wanderers){
    if (w.state === 'idle'){
      w.timer -= dt;
      if (w.timer <= 0){
        const f = freeTile();
        const path = f ? bfs([[w.tx, w.ty]], (x, y) => x === f[0] && y === f[1]) : null;
        if (path && path.length > 1){ w.path = path.slice(1); w.state = 'walk'; } else w.timer = rand(2, 5);
      }
    } else if (stepPath(w, dt)){ w.state = 'idle'; w.timer = rand(3, 9); w.dir = 'down'; }
  }
}

/* ================= LIGHTING ================= */
const lcv = document.createElement('canvas'); lcv.width = W; lcv.height = H;
const lctx = lcv.getContext('2d');

function lightSources(){
  const L = layout(), out = [];

    if (d.glow) out.push({x:cx, y:cy, r:d.glow[0], col:d.glow[1]});
    if (d.cat === 'desk' || d.cat === 'ceo') out.push({x:p.x * TS + 9, y:FY + p.y * TS + 12, r:d.cat === 'ceo' ? 30 : 12, col:d.cat === 'ceo' ? '#ffe9a0' : '#8fd0ff'}); }
  for (const p of L.w){ const d = FURN_BY[p.id]; if (d && d.glow) out.push({x:p.x * TS + d.w * 8, y:24, r:d.glow[0], col:d.glow[1]}); }

}

  lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0, 0, W, H);

  for (const s of ls){ const g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r); g.addColorStop(0, hexA(s.col, 0.2 * night)); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 7); c.fill(); }
  c.globalCompositeOperation = 'source-over';
}

/* ================= MAIN SCENE ================= */

let MG = {toss:null, zero:null, slot:null};
const SLOT_SYM = [['COFFEE',22,'#6b4420'],['DONUT',22,'#e07ab0'],['GOLD',16,'#efb341'],['STAR',14,'#5ef0e6'],['7',8,'#e05a4a'],['CASE',18,'#8a5a2b']];
const cdLeft = k => Math.max(0, (S.mg[k] || 0) - Date.now());
function startToss(){ if (cdLeft('tossCd') || (MG.toss && !MG.toss.done)) return; MG.toss = {throws:0, hits:0, power:0, pdir:1, ball:null, bin:rand(120, 220), wind:rand(-1, 1), done:false, wait:0}; }
function throwToss(){ const g = MG.toss; if (!g || g.done || g.ball || g.wait > 0) return; g.ball = {x:20, y:96, vx:40 + g.power * 170 + g.wind * 25, vy:-110 - g.power * 40}; }
function finishGame(kind, gold){ S.stats.games++; const g = gold > 0 ? addGold(gold, true) : 0; toast(kind + ' over! +' + g + ' gold bars', 'gold'); }
function startZero(){ if (cdLeft('zeroCd') || (MG.zero && MG.zero.t > 0)) return; MG.zero = {t:20, score:0, cells:new Array(12).fill(null), next:0}; }
function hitZero(i){ const g = MG.zero; if (!g || g.t <= 0 || !g.cells[i]) return; g.score += g.cells[i].type === 'spam' ? -2 : 1; g.cells[i] = null; }
function spinSlot(){
  if (S.gold < 10 || (MG.slot && MG.slot.end > performance.now() / 1000)) return;
  S.gold -= 10; S.stats.spins++;
  const reels = [0, 1, 2].map(() => SLOT_SYM.indexOf(wpick(SLOT_SYM, s => s[1])));
  MG.slot = {reels, end:performance.now() / 1000 + 1.2, paid:false, msg:''};
}
function payoutSlot(){
  const g = MG.slot, [a, b, c] = g.reels, n = SLOT_SYM[a][0];
  let msg;
  if (a === b && b === c){
    if (n === '7'){ S.stats.jackpots++; msg = 'JACKPOT! ' + fx.gold(250); }
    else if (n === 'GOLD') msg = fx.gold(60);
    else if (n === 'STAR'){ openCrate('premium', true); msg = 'Free Premium Crate!'; }
    else if (n === 'CASE') msg = fx.boost('income', 3, 300, 'Vending luck');
    else if (n === 'COFFEE') msg = fx.boost('click', 10, 120, 'Vending coffee');
    else msg = fx.gold(30);
  } else if (a === b || b === c || a === c) msg = fx.gold(12);

  g.msg = msg; g.paid = true; S.stats.games++;
}
function mgTick(dt, t){
  const g = MG.toss;
  if (g && !g.done){
    if (!g.ball){ g.power += g.pdir * dt * 1.3; if (g.power > 1){ g.power = 1; g.pdir = -1; } if (g.power < 0){ g.power = 0; g.pdir = 1; } }
    if (g.wait > 0) g.wait -= dt;
    if (g.ball){ const b = g.ball; b.vy += 220 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y >= 100){ const hit = Math.abs(b.x - g.bin) < 9; if (hit) g.hits++; g.throws++; g.last = hit ? 'IN!' : 'MISS'; g.ball = null; g.wait = 0.6; g.bin = rand(110, 225); g.wind = rand(-1, 1);
        if (g.throws >= 5){ g.done = true; S.mg.tossCd = Date.now() + 10 * 60 * 1000; if (g.hits === 5) S.stats.tossPerfect++; finishGame('Paper Toss', g.hits * 3 + (g.hits === 5 ? 10 : 0)); dirty.break = true; } } }
  }
  const z = MG.zero;
  if (z && z.t > 0){
    z.t -= dt; z.next -= dt;
    z.cells.forEach((c, i) => { if (c && c.until < t) z.cells[i] = null; });
    if (z.next <= 0){ z.next = 0.42; const empty = z.cells.map((c, i) => c ? -1 : i).filter(i => i >= 0); if (empty.length) z.cells[pick(empty)] = {type:Math.random() < 0.18 ? 'spam' : 'mail', until:t + 1.0}; }
    if (z.t <= 0){ S.mg.zeroCd = Date.now() + 10 * 60 * 1000; S.stats.zeroBest = Math.max(S.stats.zeroBest, z.score); finishGame('Inbox Zero', Math.max(0, Math.floor(z.score / 3))); dirty.break = true; }
  }
  if (MG.slot && !MG.slot.paid && MG.slot.end <= t){ payoutSlot(); dirty.break = true; }
  if (S.tab === 'break') drawMinigames(t);
}
function drawMinigames(t){
  const tc = $('tossCv');

    R(c, 0, 0, 240, 120, '#cdbb8e'); R(c, 0, 104, 240, 16, '#6d7b8a'); R(c, 0, 100, 240, 4, '#8f7d55');
    for (let x = 0; x < 240; x += 4) R(c, x, 108 + (x % 8 ? 0 : 4), 1, 1, '#62707e');
    drawChar(c, 6, 84, bossLook(), {pose:'stand', t, idx:0, happy:true, dir:'right'});
    const bx = g ? g.bin : 170; R(c, bx - 8, 90, 16, 14, '#55606b'); R(c, bx - 9, 88, 18, 3, '#7a828c'); R(c, bx - 5, 93, 1, 9, '#3a3f47'); R(c, bx + 3, 93, 1, 9, '#3a3f47');

      c.font = '8px Silkscreen, monospace'; c.fillStyle = '#2a2830'; c.textBaseline = 'top';

    } else { c.font = '8px Silkscreen, monospace'; c.fillStyle = '#2a2830'; c.textBaseline = 'top'; c.fillText(cdLeft('tossCd') ? 'BACK IN ' + fmtTime(cdLeft('tossCd') / 1000) : 'PRESS START', 80, 50); }
  }
  const sc = $('slotCv');
  if (sc){
    const c = sc.getContext('2d'); c.imageSmoothingEnabled = false; const g = MG.slot, spinning = g && g.end > t;
    R(c, 0, 0, 240, 120, '#b03a3a'); R(c, 10, 10, 220, 80, '#2a2830');

      c.fillStyle = SLOT_SYM[idx][2]; c.fillText(SLOT_SYM[idx][0], 50 + k * 70, 50);

    c.fillStyle = '#ffe9a0'; c.fillText(g && g.paid ? g.msg.slice(0, 34) : spinning ? 'SPINNING...' : '10 GOLD A SPIN', 120, 104);
    c.textAlign = 'left';
  }
  const zg = $('zeroGrid');
  if (zg && MG.zero){ [...zg.children].forEach((b, i) => { const cell = MG.zero.cells[i]; const cls = cell ? cell.type : ''; if (b.className !== cls){ b.className = cls; b.textContent = cell ? (cell.type === 'spam' ? 'SPAM' : 'MAIL') : ''; } }); setText($('zeroInfo'), MG.zero.t > 0 ? 'Time ' + Math.ceil(MG.zero.t) + 's · score ' + MG.zero.score : 'Final score ' + MG.zero.score); }
}

const spriteCache = {};
function itemSprite(it){
  if (spriteCache[it.id]) return spriteCache[it.id];
  let seed = hash(it.id + it.name) || 1;
  const rnd = () => { seed = (Math.imul(seed, 1103515245) + 12345) >>> 0; return (seed >>> 8) / 16777216; };
  const g = [];
  for (let y = 0; y < 8; y++){ g[y] = []; for (let x = 0; x < 4; x++){ const v = rnd() < (y === 0 || y === 7 ? 0.35 : 0.6) ? (rnd() < 0.3 ? 2 : 1) : 0; g[y][x] = v; g[y][7 - x] = v; } }
  for (let y = 1; y < 7; y++) if (!g[y][3]){ g[y][3] = 1; g[y][4] = 1; }
  const cnv = document.createElement('canvas'); cnv.width = 10; cnv.height = 10; const c = cnv.getContext('2d');
  const main = RAR[it.r].c, alt = 'hsl(' + (hash(it.name) % 360) + ',65%,58%)';
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (g[y][x]) for (const [dx, dy] of DIRS){ const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx > 7 || ny > 7 || !g[ny][nx]) R(c, nx + 1, ny + 1, 1, 1, '#14141c'); }
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (g[y][x]) R(c, x + 1, y + 1, 1, 1, g[y][x] === 2 ? alt : main);
  R(c, 3, 2, 1, 1, 'rgba(255,255,255,.7)');
  spriteCache[it.id] = cnv; return cnv;
}
function itemIcon(cnv, it, known){
  const c = cnv.getContext('2d'); c.imageSmoothingEnabled = false; R(c, 0, 0, 10, 10, '#272c44');
  if (known) c.drawImage(itemSprite(it), 0, 0); else { R(c, 3, 2, 4, 1, '#4c5170'); R(c, 6, 3, 1, 2, '#4c5170'); R(c, 4, 5, 2, 1, '#4c5170'); R(c, 4, 7, 2, 1, '#4c5170'); }
}

  if (dc){ NEEDS.forEach(([k]) => setBar(document.querySelector(`[data-hn="${k}"]`), dc.sat[k] / 1.5)); setText($('hStyle'), '×' + xf(dc.styleMult)); setBar($('hStyleB'), Math.log10(1 + dc.style) / 6); setText($('hTidy'), S.trash.length ? '−' + Math.round((1 - dc.cleanF) * 100) + '%' : 'OK'); setBar($('hTidyB'), dc.cleanF * 1.25 - 0.25); }
  const bs = S.boosts.filter(b => b.end > Date.now());

  const dots = {

    research:S.tr >= 1 && S.research.active.length < M.slots && RESEARCH.some(p => !S.research.done[p.id] && !S.research.active.some(a => a.id === p.id) && resAvailable(p)),
    contracts:S.contracts.slots.some(c => c && !c.cool && contractProg(c) >= 1), collection:S.gold >= 30, skills:skillPoints() > 0, prestige:canSell() || canIPO() || canMerge(),
    inbox:S.inbox.msgs.some(m => !m.read && !(m.kind === 'dec' && m.done)), talent:S.gold >= 40 && S.talent.roster.length < M.roster, break:!cdLeft('tossCd') || !cdLeft('zeroCd'),
    decor:dc && emp >= 5 && NEEDS.some(([k]) => dc.sat[k] < 0.6),

  document.querySelectorAll('.tab').forEach(b => { b.querySelector('.dot').hidden = !dots[b.dataset.tab]; });
  document.querySelectorAll('.cat').forEach(b => { const c = CATS.find(x => x[0] === b.dataset.cat); b.querySelector('.dot').hidden = !c[2].some(t => dots[t]); });
}
function updateUI(force){

let floatSide = 0;

/* ================= INPUT ================= */
const confirmPair = (a, on) => { const q = s => pane.querySelector(`[data-act=${s}]`); q(a + '1').hidden = on; q(a + 'yes').hidden = !on; q(a + 'no').hidden = !on; };
let resetArmed = 0;
function ensureCeo(){ const L = layout(); if (!L.f.some(p => p.id === 'ceo')){ const A = areaOf(S.office); for (let y = A.h - 2; y >= 0; y--) for (let x = A.x0; x < A.x0 + A.w - 1; x++) if (canPlace(FURN_BY.ceo, x, y, L, S.office)){ L.f.push({id:'ceo', x, y}); decorDirty = layoutDirty = true; return; } } }
function cancelPlacing(){ placing = null; ensureCeo(); updateDecorHint(); updateUI(true); }

  up:id => { if (buyUpgrade(id)) updateUI(true); }, buyall:() => { if (buyAllUpgrades()) updateUI(true); },

  ipo1:() => confirmPair('ipo', true), ipono:() => confirmPair('ipo', false), ipoyes:() => { doIPO(); updateUI(true); },
  merge1:() => confirmPair('merge', true), mergeno:() => confirmPair('merge', false), mergeyes:() => { doMerge(); updateUI(true); },
  achf:id => { S.opt.achFilter = id; RENDER.awards(); },
  decor:() => setDecorMode(!decorMode), arrange:() => autoArrange(), storeall:() => storeAll(),
  cancelplace:() => cancelPlacing(), movesel:() => moveItem(selected), storesel:() => storeItem(selected), desel:() => { selected = null; updateDecorHint(); updateUI(true); },
  fcat:id => { S.opt.fcat = id; RENDER.decor(); UPDATE.decor(); },
  fbuy:id => buyFurn(id), fplace:id => startPlacing(id), flv:id => levelFurn(id),
  hunt:id => headhunt(id), train:id => trainTalent(+id), release:id => releaseTalent(+id),
  frac:id => { S.market.frac = +id; RENDER.market(); UPDATE.market(); },
  sbuy:id => buyStock(id), ssell:id => sellStock(id),
  decide:id => { const [m, k] = id.split(':').map(Number); decide(m, k); },
  claimmail:id => claimMail(+id),
  tossstart:() => { startToss(); updateUI(); }, toss:() => { if (!MG.toss || MG.toss.done) startToss(); else throwToss(); updateUI(); },
  zerostart:() => { startZero(); updateUI(); }, zero:id => hitZero(+id),
  spin:() => { spinSlot(); updateUI(); },
  export:() => { $('saveBox').value = encodeSave(); $('saveBox').select(); },
  copysave:() => { const box = $('saveBox'); if (!box.value) box.value = encodeSave(); box.select(); const p = navigator.clipboard && navigator.clipboard.writeText(box.value); if (p) p.then(() => toast('Save code copied.'), () => toast('Select the code and copy it yourself.')); else toast('Select the code and copy it yourself.'); },
  import:() => { try { const v = $('saveBox').value; if (!v.trim()) return toast('Paste a save code first.'); S = decodeSave(v); afterLoad(); toast('Save loaded.', 'gold'); } catch(e){ toast('That save code is not valid. Check that you copied all of it.'); } },
  dlsave:() => { const blob = new Blob([encodeSave()], {type:'text/plain'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pixel-office-tycoon-save-' + new Date().toISOString().slice(0, 10) + '.txt'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); },
  ulsave:() => $('fileIn').click(),
  reset:(id, b) => {
    if (Date.now() - resetArmed < 4000){ S = fresh(); save(); afterLoad(); toast('Progress erased. Back to the garage.'); resetArmed = 0; }
    else { resetArmed = Date.now(); b.textContent = 'Click again within 4 seconds to erase everything'; setTimeout(() => { if (b.isConnected) b.textContent = 'Erase all progress'; }, 4000); }
  },
};
function canvasPoint(e){ const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
function onCanvasDown(e){
  if (e.button === 2) return;
  const [lx, ly] = canvasPoint(e);
  if (ev && lx > ev.x - 6 && lx < ev.x + 17 && ly > ev.y - 9 && ly < ev.y + 13){ claimEvent(lx, ly); updateHUD(); return; }
  const ti = S.trash.findIndex(tr => { const x = tr.x * TS + 4 + tr.r, y = FY + tr.y * TS + 6 + tr.r; return lx > x - 4 && lx < x + 12 && ly > y - 4 && ly < y + 10; });
  if (ti >= 0){ cleanTrash(ti, lx, ly); updateHUD(); return; }
  if (decorMode){
    const tx = Math.floor(lx / TS), ty = ly < FY ? -1 : Math.floor((ly - FY) / TS);
    if (placing){ if (placeAt(tx, ty)) updateUI(true); else toast('That spot is blocked. Try a green one.'); }
    else { selected = itemAt(lx, ly); updateDecorHint(); updateUI(true); }
    return;
  }
  const pet = pets.find(p => Math.abs(lx - (p.x + 4)) < 8 && Math.abs(ly - (p.y + 2)) < 7);
  if (pet){ S.stats.pets++; floater(pet.kind === 'dog' ? 'WOOF!' : pet.kind === 'cat' ? 'PURR' : pet.kind === 'parrot' ? 'SQUAWK!' : 'RAWR!', lx, ly); return; }
  work(lx, ly); updateHUD();
}
function wire(){
  buildNav(); buildNeeds();
  $('cats').addEventListener('click', e => { const b = e.target.closest('.cat'); if (b) showCat(b.dataset.cat); });
  $('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) showTab(b.dataset.tab); });
  pane.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = ACT[b.dataset.act]; if (f) f(b.dataset.id, b); });
  pane.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.assign){ assignTalent(+el.dataset.assign, el.value); return; }
    const path = el.dataset && el.dataset.set; if (!path) return;
    const [a, k] = path.split('.');

    if (a === 'opt'){ markAll(); recalc(); }

  });
  $('fileIn').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();

  $('decorBtn').addEventListener('click', () => setDecorMode(!decorMode));
  $('wrap').addEventListener('pointerdown', onCanvasDown);
  $('wrap').addEventListener('pointermove', e => { if (!decorMode) return; const [lx, ly] = canvasPoint(e); hoverTile = [Math.floor(lx / TS), ly < FY ? -1 : Math.floor((ly - FY) / TS)]; });
  $('wrap').addEventListener('pointerleave', () => { hoverTile = null; });
  $('wrap').addEventListener('contextmenu', e => { if (decorMode){ e.preventDefault(); if (placing) cancelPlacing(); else { selected = null; updateDecorHint(); updateUI(true); } } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && decorMode){ if (placing) cancelPlacing(); else setDecorMode(false); } });
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
}

/* ================= LOOP ================= */
let lastT = 0, lastUI = 0, lastSec = 0, lastSaveT = 0, lastAuto = 0;
function frame(nowMs){
  const dt = Math.min(3600, Math.max(0, (nowMs - lastT) / 1000)); lastT = nowMs;
  const t = nowMs / 1000;
  recalc();
  if (M.income > 0) earn(M.income * dt);
  if (M.emp) addXP(0.1 * M.emp * dt);
  S.stats.play += Math.min(dt, 5);
  if (M.auto > 0){ autoAcc += M.auto * Math.min(dt, 60); let n = 0; while (autoAcc >= 1 && n < 600){ autoAcc -= 1; n++; } if (n){ earn(M.clickVal * n); S.stats.clicks += n; addXP(0.5 * n); bossBump = 0.2; } }
  if (!nextEvent) scheduleEvent(t);
  if (!ev && t > nextEvent) spawnEvent(t);
  if (ev && t > ev.until){ ev = null; scheduleEvent(t); }
  if (S.research.active.length) checkResearch();
  if (S.boosts.length && S.boosts.some(b => b.end <= Date.now())) S.boosts = S.boosts.filter(b => b.end > Date.now());
  tickTrash(Math.min(dt, 60));
  if (nowMs - lastAuto > 500){ lastAuto = nowMs; runAutomation(); }
  if (nowMs - lastMarket > 5000){ lastMarket = nowMs; tickMarket(); }
  S.stats.maxEmp = Math.max(S.stats.maxEmp, M.emp);
  mgTick(Math.min(dt, 0.1), t);
  draw(t, Math.min(dt, 0.1));
  if (nowMs - lastUI > 200){ lastUI = nowMs; updateUI(); }
  if (nowMs - lastSec > 1000){ lastSec = nowMs; checkAchievements(); tickContracts(); tickInbox(); checkRivals(); tickWeather(); }
  if (nowMs - lastSaveT > 10000){ lastSaveT = nowMs; save(); }
  requestAnimationFrame(frame);
}
function dailyBonus(){
  const today = new Date().toDateString();
  if (S.daily.last === today) return;
  const y = new Date(Date.now() - 86400000).toDateString();
  S.daily.streak = S.daily.last === y ? S.daily.streak + 1 : 1;
  S.daily.last = today;
  const g = addGold(10 + 5 * Math.min(S.daily.streak, 10), true);
  setTimeout(() => toast('Daily bonus: +' + g + ' gold bars (day ' + S.daily.streak + ' streak)', 'gold'), 900);
}
function afterLoad(){
  crewDirty = true; petsDirty = true; decorDirty = true; talentDirty = true; layoutDirty = true; blocked = null;
  ev = null; coins.length = 0; lastReveal = []; lastTalent = null; placing = null; selected = null;
  if (decorMode) setDecorMode(false);
  achN = Object.keys(S.ach).length;
  initMarket(); layout(); ensureCeo();
  recalc(); tickContracts();
  markAll(); showCat(S.cat || 'biz');
}
function start(){
  S = loadSaved() || fresh();
  achN = Object.keys(S.ach).length;
  initMarket();
  recalc();
  const away = Math.min(M.offCap, Math.max(0, (Date.now() - (S.lastSave || Date.now())) / 1000));
  if (away > 30 && (M.income > 0 || M.emp)){
    const v = M.income * away * M.offRate;
    earn(v); addXP(0.1 * M.emp * away * M.offRate);
    for (let i = 0; i < Math.min(12, Math.floor(away / 300)); i++) spawnTrash();
    setTimeout(() => toast('While you were away (' + fmtTime(away) + ') your staff earned ' + money(v), 'gold'), 400);
  }
  checkResearch(); dailyBonus();
  wire(); afterLoad();
  if (migrated) setTimeout(() => toast('Imported your v2 progress. Welcome to v3!', 'lvl'), 1400);
  if (month() === 9) setTimeout(() => toast('Spooky season! Halloween furniture is in the Decor shop this month.', 'mail'), 2200);
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
}
window.__POT = {get S(){ return S; }, get M(){ return M; }, get DEC(){ return DEC; }, ACH, UPGRADES, RESEARCH, ITEMS, STAFF, OFFICES, FURN, recalc, doSell, doIPO, doMerge, openCrate, showTab, showCat, ALL_TABS, layout, autoArrange, setDecorMode, startPlacing, placeAt, buyFurn, headhunt, buyStock, sellStock, spawnDecision, decide, startToss, throwToss, startZero, spinSlot, checkAchievements, checkRivals, checkStory, tickMarket, spawnTrash,
  forceDirty:() => { decorDirty = true; talentDirty = true; crewDirty = true; layoutDirty = true; petsDirty = true; }};
start();

})();
